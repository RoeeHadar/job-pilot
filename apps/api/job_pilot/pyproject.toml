[project]
name = "job_pilot"
version = "0.1.0"
description = "job_pilot using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.5,<2.0.0"
]

[project.scripts]
kickoff = "job_pilot.main:kickoff"
run_crew = "job_pilot.main:kickoff"
plot = "job_pilot.main:plot"
run_with_trigger = "job_pilot.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
